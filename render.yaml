# Render blueprint for the Spring Boot backend.
# In Render: New > Blueprint, point at this repo. Set the secret env vars below.
services:
  - type: web
    name: tally-clone-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false # jdbc:postgresql://<neon-host>/<db>?sslmode=require
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false # your vercel.app URL, e.g. https://spring-works.vercel.app
