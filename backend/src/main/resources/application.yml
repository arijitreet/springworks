server:
  # Render injects PORT; locally we default to 8080.
  port: ${PORT:8080}

spring:
  application:
    name: tally-clone-backend

  datasource:
    # JDBC URL, e.g. jdbc:postgresql://<host>/<db>?sslmode=require
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tally}
    username: ${SPRING_DATASOURCE_USERNAME:tally}
    password: ${SPRING_DATASOURCE_PASSWORD:tally}

  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate only validates that entities match.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true

# Comma-separated list of origins allowed to call the API.
# Locally this is the Vite dev server; in production set it to your vercel.app URL.
app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    org.flywaydb: info
